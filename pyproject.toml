[project]
name = "dungeon-in-my-terminal"
version = "0.1.0"
description = "A procedurally generated, dice-driven roguelike dungeon crawler that lives in your terminal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "rockleona", email = "34214497+rockleona@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.6.1",
    "windows-curses>=2.3.3; sys_platform == 'win32'",
]

[project.scripts]
dungeon = "dungeon_in_my_terminal.cli:main"
dungeon-in-my-terminal = "dungeon_in_my_terminal.cli:main"

[dependency-groups]
dev = [
    "pyte>=0.8.2",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
