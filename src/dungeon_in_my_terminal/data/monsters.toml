# The bestiary, split into three tiers that unlock as you descend.
#
# Table order is preserved and becomes the roster's iteration order (matters
# for --seed replay determinism), so add new non-boss monsters where they
# belong by depth rather than at the end. `is_boss = true` entries need a
# `boss_floor` — that's the floor number that spawns them instead of the
# regular per-room roll (see core/monsters.py's boss_for()).
#
# `ai` is one of "melee" / "ranged" / "support" (core/monsters.py's AI enum).

# --------------------------------------------------------------------------- #
# Tier 1 — floors 1-3
# --------------------------------------------------------------------------- #

