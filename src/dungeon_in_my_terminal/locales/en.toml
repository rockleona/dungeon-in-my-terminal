# English translation table.
#
# Keyed by the Traditional Chinese template exactly as it appears at its call
# site to `i18n.t()` — see i18n.py for why the source string doubles as its
# own key. Grouped into one table per module the strings are called from
# (matching the source layout); keep new entries in the matching table so
# this stays scannable.
#
# `[_ctx.<name>]` tables are the one exception: they hold entries whose call
# site passes `i18n.t(text, _ctx="<name>")` to disambiguate a Chinese source
# string that needs two different English translations depending on where
# it's used (e.g. the Bless *ability* "祝福" vs. the Blessed *status label*
# "祝福", both under `[core.classes]`/`[_ctx.status]` respectively). The
# `_ctx` prefix is reserved — a real template key never starts with it.

[core.dice]
"重擊!" = "Critical!"
"大失敗!" = "Fumble!"
"命中" = "Hit"
"落空" = "Miss"
"d20={natural}(優勢, 另一顆 {other})" = "d20={natural}(advantage, other roll {other})"
"看不懂的骰子式: {expr!r}" = "Unparseable dice expression: {expr!r}"

# core/entity.py — Status.label uses _ctx="status" to disambiguate from
# any ability of the same name (e.g. the Bless ability is also "祝福").
# Kept short (~2 CJK-char width) so a stacked status doesn't crowd the
# hero name out of the party column entirely — see render.py:_draw_member.
[_ctx.status]
"暈眩" = "Stun"
"緩速" = "Slow"
"祝福" = "Bless"
"被挑釁" = "Taunt"

# core/entity.py — STAT_NAMES, read via i18n.t(STAT_NAMES[stat]) in the
